[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@~8.3.11
      # ESP32-A2DP is vendored into lib/ESP32-A2DP (pinned upstream commit
      # 7da8b6e + two BT-stability patches) — PlatformIO never reinstalls
      # project-local libs, so the patches survive everywhere; see README.
      # arduino-libhelix is vendored into lib/libhelix (helix_malloc patched
      # to a static BSS pool): the MP3 decoder's core buffers used to be
      # heap allocations that no longer fit once Bluetooth had carved its
      # ~88 KB, which wedged the decode task; see README.
build_flags =
    -O2
    -fno-threadsafe-statics
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_MEM_SIZE=24576
      # LVGL runs on its own static pool. The UI now builds one page at a
      # time (lazy pages), so 24 KB holds any single page with headroom.
      # The old 45 KB pool starved the runtime heap that Bluetooth needs.
    -D LV_FONT_UNSCII_16=1
    -D LV_USE_LOG=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_SHADOW_CACHE_SIZE=0
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_40=1
